<header>
  <h1>CryptoDoc — Cifrado en el Navegador</h1>
  <p>Procesamiento 100% local en memoria RAM.</p>
</header>

<nav aria-label="Modos de cifrado">
  <button
    type="button"
    [attr.aria-pressed]="activeTab() === 'symmetric'"
    (click)="selectTab('symmetric')">
    Simétrico (AES-256)
  </button>

  <button
    type="button"
    [attr.aria-pressed]="activeTab() === 'asymmetric'"
    (click)="selectTab('asymmetric')">
    Asimétrico / Kleopatra (OpenPGP)
  </button>
</nav>

<hr />

<main>
  @if (activeTab() === 'symmetric') {
    <app-symmetric />
  } @else {
    <app-asymmetric />
  }
</main>
